name: myStock Market Alert Scheduler

on:
  # cron-job.org 등 외부 정밀 크론 서비스 및 GitHub API 즉시 트리거
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '다이버전스 신호 탐색 기간(일)'
        required: false
        default: '7'
        type: string
  repository_dispatch:
    types: [trigger-market-alert]
    inputs:
      lookback_days:
        description: '다이버전스 신호 탐색 기간(일)'
        required: false
        default: '7'
        type: string

jobs:
  run-market-alert:
    name: Scan Market & Send Telegram Alerts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Market Scanner & Send Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DAYS="${{ github.event.inputs.lookback_days || '7' }}"
          python scheduler.py --now --days $DAYS
