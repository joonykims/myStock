name: myStock Market Alert Scheduler

on:
  schedule:
    # 1. 국내장 마감 정기 알림: 매주 월~금 15:45 KST (UTC 06:45)
    - cron: '45 6 * * 1-5'
    # 2. 미국장 마감 정기 알림: 매주 화~토 06:30 KST (UTC 월~금 21:30)
    - cron: '30 21 * * 1-5'

  # GitHub 웹 화면에서 'Run workflow' 버튼으로 언제든 수동 즉시 실행 가능
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '다이버전스 신호 탐색 기간(일)'
        required: false
        default: '7'
        type: string

jobs:
  run-market-alert:
    name: Scan Market & Send Telegram Alerts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Market Scanner & Send Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DAYS="${{ github.event.inputs.lookback_days || '7' }}"
          python scheduler.py --now --days $DAYS
